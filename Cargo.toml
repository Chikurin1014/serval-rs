[workspace]
resolver = "2"
members = ["packages/ui", "packages/web", "packages/desktop", "packages/mobile"]

# One version for the whole app, which release-please bumps
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
dioxus = { version = "0.7.1" }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components" }

# workspace
ui = { path = "packages/ui" }
