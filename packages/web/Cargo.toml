[package]
name = "web"
version.workspace = true
license.workspace = true
publish = false
edition.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["router"] }
dioxus-icons = { workspace = true }
serial-runtime = { workspace = true, features = ["web"] }
ui = { workspace = true }

js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["web"]
web = ["dioxus/web"]
