[package]
name = "desktop"
version.workspace = true
license.workspace = true
publish = false
edition.workspace = true

[dependencies]
# Local time, as the app shows times
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
dioxus = { workspace = true, features = ["router"] }
# Its assets, if in its binary: so it can be one file
embed-assets = { workspace = true }
# Its icon, of a PNG: as Dioxus decodes images
image = { version = "0.25", default-features = false, features = ["png"] }
# The OS's file dialogs, as Dioxus's own file inputs use
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serialport = "4.7"
# Reading the ports on threads, and the app's timers: on Dioxus's runtime
tokio = { version = "1", features = ["rt", "sync", "time"] }
ui = { workspace = true }
usb-ids = "1.2026.6"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
