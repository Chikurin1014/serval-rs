[application]
name = "Serval"

[bundle]
identifier = "io.github.chikurin1014.serval"
publisher = "Chikurin1014"
icon = ["../web/assets/favicon.png"]
category = "DeveloperTool"
short_description = "Cross-Platform Serial Visualizer"

# Not signed by a developer, but macOS on Apple silicon opens nothing unsigned
[bundle.macos]
signing_identity = "-"
hardened_runtime = false

[bundle.windows]
icon_path = "../web/assets/favicon.ico"

[bundle.windows.wix]
fragment_paths = ["wix/path.wxs"]
component_refs = ["AddToPath"]
