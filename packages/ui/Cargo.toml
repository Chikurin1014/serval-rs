[package]
name = "ui"
version.workspace = true
license.workspace = true
publish = false
edition.workspace = true

[dependencies]
dioxus = { workspace = true }
dioxus-icons = { workspace = true }
logic = { workspace = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = [
  "router",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# A Box plot's values, kept sorted as they come and go
sorted-vec = "0.8"

[dev-dependencies]
dioxus-ssr = "0.7"
logic = { workspace = true, features = ["testing"] }
