[package]
name = "logic"
version.workspace = true
license.workspace = true
publish = false
edition.workspace = true

[dependencies]
dioxus = { workspace = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = [
  "router",
] }
fancy-regex = "0.19"
# The seed of plugins' random numbers: from the OS, or the browser's
# `crypto.getRandomValues` on the web
getrandom = { version = "0.4", features = ["wasm_js"] }
# Plugins' random numbers, of the seed
rand = { version = "0.10", default-features = false }
# Plugins, compiled and run in the page; their output captured
rune = { version = "0.14", default-features = false, features = [
  "std",
  "capture-io",
  # Compile errors told as a compiler does: each line and its code
  "emit",
] }
serde ={ version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# What other crates' tests run maps with
testing = []
