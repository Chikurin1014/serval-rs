# The documents, at `/docs/` of the site: `mdbook build docs` builds them into
# `docs/book`, of no app. Each app takes them in as it is built: the web app's
# `dx serve` and `dx build` of `packages/web/public/docs` (`mdbook build docs
# --dest-dir packages/web/public/docs`), Nix's of its own build
# (`flake-parts/docs.nix`, `flake-parts/web.nix`)
[book]
title = "Serval"
language = "en"
src = "src"

[build]
build-dir = "book"
# Each page as `SUMMARY.md` lists it, none made up for it
create-missing = false

[output.html]
# Where they are served from, for the links of the page of a missing one
site-url = "/docs/"
git-repository-url = "https://github.com/Chikurin1014/serval-rs"
edit-url-template = "https://github.com/Chikurin1014/serval-rs/edit/main/docs/{path}"
# Mermaid's diagrams, drawn in the page (`mdbook-mermaid install docs` wrote
# these scripts)
additional-js = ["mermaid.min.js", "mermaid-init.js"]

# Turns the `mermaid` code blocks into Mermaid's diagrams
[preprocessor.mermaid]
command = "mdbook-mermaid"
