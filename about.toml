# What `cargo about` lists in `packages/web/public/third-party-licenses.html`:
# the crates compiled into the web app, by the licenses we accept for them
# (in order of preference, for crates offering a choice). The page also lists
# what is bundled without being a crate, written in `about.hbs`.
#
# Regenerate after changing dependencies (in `nix develop`):
#   cargo about generate --manifest-path packages/web/Cargo.toml about.hbs \
#     -o packages/web/public/third-party-licenses.html
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "ISC", "CC0-1.0"]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Serval's own crates (`publish = false`)
private = { ignore = true }

# dioxus-icons: the license of its Lucide icons comes with it, as
# `LICENSE-LUCIDE`, which `cargo about` does not pick up by itself
[dioxus-icons.clarify]
license = "MIT AND ISC"

[[dioxus-icons.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "c15f33917159707e9856aad3706e4efd64207dc3062e1b99d8e166ba1c7b4c6f"

[[dioxus-icons.clarify.files]]
path = "LICENSE-LUCIDE"
license = "ISC"
checksum = "b495047bd93a9b06913511076f504daba17d5bbeb3e0650f3bb53a4220329c57"
