name: Desktop

# Builds the desktop app for each OS: on changes to it, and for a release, to
# which the builds are attached. On a pull request, they are artifacts of the run.
on:
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - packages/desktop/**
      - packages/embed-assets/**
  workflow_call:
    inputs:
      tag:
        description: The release to attach the builds to
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  DIOXUS_CLI_VERSION: 0.7.9

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: target/dx/serval/release/linux/app/serval
            one-file: serval
          - os: windows-latest
            binary: target/dx/serval/release/windows/app/serval.exe
            one-file: serval.exe
          - os: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the libraries the app needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      # Only its release, not its source if looking for that takes long
      - name: Install dx
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall dioxus-cli --version "$DIOXUS_CLI_VERSION" --no-confirm --strategies crate-meta-data --maximum-resolution-timeout 120

      - name: Build one file
        if: matrix.one-file
        working-directory: packages/desktop
        run: dx build --platform desktop --release --profile desktop-release

      - name: Put the assets in the file
        if: matrix.one-file
        run: |
          mkdir -p dist
          cargo run -p embed-assets -- "${{ matrix.binary }}" "dist/${{ matrix.one-file }}"

      - name: Bundle
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: |
          # dx strips with rust-objcopy, telling it where its library is only
          # as Linux takes it
          llvm=$(find "$(rustc --print sysroot)" -name 'libLLVM*.dylib' | head -n 1)
          DYLD_FALLBACK_LIBRARY_PATH=$(dirname "$llvm")
          export DYLD_FALLBACK_LIBRARY_PATH
          dx bundle --platform desktop --package-types dmg --release --profile desktop-release --out-dir bundle
          mkdir -p ../../dist
          mv bundle/*.dmg ../../dist/Serval-arm64.dmg

      - name: Bundle for Windows
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        run: |
          dx bundle --platform desktop --package-types msi --release --profile desktop-release --out-dir bundle
          mkdir -p ../../dist
          mv bundle/*.msi ../../dist/Serval-x64.msi

      # An Apple silicon Mac opens nothing without a valid signature, even ad hoc
      - name: Check the app's signature
        if: runner.os == 'macOS'
        run: |
          mount=$(hdiutil attach dist/Serval-arm64.dmg -nobrowse | tail -n 1 | cut -f 3)
          codesign --verify --deep --verbose "$mount/Serval.app"
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@v4
        with:
          name: serval-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber
