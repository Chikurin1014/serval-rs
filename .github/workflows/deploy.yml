name: Deploy

# Publishes the web app to Cloudflare Pages: when release-please releases (see
# the `deploy` job in release-please.yml), or by hand from the Actions tab.
#
# Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token with only "Account > Cloudflare Pages > Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account the `serval` Pages project is in
on:
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to build
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, each to the end: the last one started is what is live
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release's tag, or the branch chosen when run by hand
          ref: ${{ inputs.ref || github.ref }}

      - uses: cachix/install-nix-action@v31

      # The Nix store CI saved (see ci.yml), to build on; saved only by CI
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      # The release build of the web app, as static files in
      # result/share/serval-web (see `mkPackage` in flake-parts/serval.nix)
      - name: Build the web app
        run: nix build .#web --print-build-logs

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # To production (the project's production branch), whichever ref was built
          command: pages deploy result/share/serval-web --project-name serval --branch main --commit-hash ${{ github.sha }}
