name: Deploy

# Needs the secrets CLOUDFLARE_API_TOKEN ("Cloudflare Pages: Edit" only) and
# CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to build
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: cachix/install-nix-action@v31

      # Saved only by CI
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Build the web app
        run: nix build .#web --print-build-logs

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # To production, whichever ref was built
          command: pages deploy result/share/serval-web --project-name serval --branch main --commit-hash ${{ github.sha }}
